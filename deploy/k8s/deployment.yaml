apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-event-gateway
  namespace: event-mesh
  labels:
    app.kubernetes.io/name: enterprise-event-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: enterprise-event-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enterprise-event-gateway
    spec:
      containers:
      - name: gateway
        image: devopstrio/enterprise-event-gateway:latest
        ports:
        - containerPort: 8080
          name: http-events
